name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.os }} (${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Compile (all targets)
        run: cargo check --all-targets

      - name: Clippy (deny warnings)
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --color never -- -D warnings > clippy-output.txt 2>&1
          status=$?
          cat clippy-output.txt
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' clippy-output.txt | grep -E '^(warning|error)' | head -40 | while read -r line; do
              printf '::error title=clippy::%s\n' "${line:0:220}"
            done
          fi
          exit "$status"

      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --color never > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -A3 'panicked at' | head -60 | while read -r line; do
              printf '::error title=test::%s\n' "${line:0:220}"
            done
          fi
          exit "$status"
