[package]
name = "rewind"
version = "0.1.0"
edition = "2021"
description = "Conservative local workspace filesystem state capture and recovery."
repository = "https://github.com/OG-Huzzi/Rewind"
readme = "README.md"
keywords = ["filesystem", "workspace", "recovery", "undo"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.98.1"
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/src/**"]

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
notify = "8.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13"
