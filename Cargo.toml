[package]
name = "rewind"
version = "0.1.0"
edition = "2021"
description = "Conservative local workspace state capture and recovery"
license = "MIT"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
notify = "8.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13"
